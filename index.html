<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boletim Digital</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho com título e subtítulo -->
  <header class="cabecalho">
    <h1>Boletim Digital</h1>
    <p class="subtitulo">8º Ano</p>
  </header>

  <main class="conteudo">

    <!-- Área dos cards de resumo -->
    <section class="cards">
      <div class="card">
        <h2>Média Geral</h2>
        <p id="media-geral" class="valor-card">—</p>
      </div>

      <div class="card">
        <h2>Total de Faltas</h2>
        <p id="total-faltas" class="valor-card">—</p>
      </div>

      <div class="card">
        <h2>Bom Desempenho</h2>
        <p id="bom-desempenho" class="valor-card">—</p>
      </div>

      <div class="card">
        <h2>Precisam de Atenção</h2>
        <p id="atencao" class="valor-card">—</p>
      </div>

      <div class="card">
        <h2>Frequência</h2>
        <p id="frequencia" class="valor-card">—</p>
        <span class="texto-frequencia">Frequência adequada</span>
      </div>
    </section>

    <!-- Tabela de disciplinas (o JavaScript vai preencher as linhas) -->
    <section class="tabela-container">
      <table class="tabela-boletim">
        <thead>
          <tr>
            <th>Disciplina</th>
            <th>1º Tri</th>
            <th>2º Tri</th>
            <th>3º Tri</th>
            <th>Média</th>
            <th>Faltas</th>
            <th>Situação</th>
          </tr>
        </thead>
        <tbody id="corpo-tabela">
          <!-- As linhas serão criadas pelo JavaScript -->
        </tbody>
      </table>
    </section>

  </main>

  <!-- Script no final para garantir que o HTML já carregou -->
  <script src="script.js"></script>
</body>
</html>
